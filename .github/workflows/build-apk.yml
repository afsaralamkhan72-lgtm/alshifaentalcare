name: Android APK banao

# GitHub par: Actions tab > "Android APK banao" > Run workflow. Kuch minute baad neeche "Artifacts" mein APK milegi.
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK licenses (runner par SDK pehle se maujood hai)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Firebase ki file (agar secret mein rakhi ho)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" > android/app/google-services.json; echo "google-services.json laga di"; else echo "google-services.json nahi hai: app banegi, lekin notification nahi chalegi"; fi
      - name: Capacitor tayyar karein
        run: |
          npm install --no-audit --no-fund
          npx cap sync android
      - name: APK banayein
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: al-shifa-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
